name: Build desktop apps
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
            command: npm run dist:mac -- --arm64
          - os: macos-14
            arch: x64
            command: npm run dist:mac -- --x64
          - os: windows-latest
            arch: x64
            command: npm run dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ${{ matrix.command }}
        env:
          JYUTBOARD_BUILD_ARCH: ${{ matrix.arch }}
      - run: node scripts/update-manifests.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: JyutBoard-${{ runner.os }}-${{ matrix.arch }}-${{ github.ref_name }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.json
            release/*.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 30
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: JyutBoard-*-${{ github.ref_name }}
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: installers/*
