name: Publish stable Windows download alias

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'Publish stable Windows download alias'
    runs-on: ubuntu-latest
    steps:
      - name: Download current Windows release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p alias
          gh release download v0.5.0 --repo "$GITHUB_REPOSITORY" --pattern "JyutBoard.Setup.0.5.0.exe" --dir alias
          gh release download v0.5.0 --repo "$GITHUB_REPOSITORY" --pattern "JyutBoard.0.5.0.exe" --dir alias
          cp alias/JyutBoard.Setup.0.5.0.exe alias/JyutBoard-Setup.exe
          cp alias/JyutBoard.0.5.0.exe alias/JyutBoard-Portable.exe

      - name: Publish stable aliases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v0.5.0 alias/JyutBoard-Setup.exe alias/JyutBoard-Portable.exe --repo "$GITHUB_REPOSITORY" --clobber
